   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="45.54" y="454.824" transform="rotate(-0 45.54 454.824)">96 Fredkin gates per ideal attempt, excluding ancilla preparation; all checks add substantial Clifford overhead.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="45.54" y="484.92" transform="rotate(-0 45.54 484.92)">The fault-free single-qubit magic yield remains 5/8. A native hardware audit is still needed.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(90.459766 146.068609)">1. Prepare and verify</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(93.388828 160.625766)">the cluster resource</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(373.879844 146.068609)">2. Gauge with the</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(351.983984 160.625766)">block-aligned controllers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(620.907031 146.068609)">3. Apply coherent frame F</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(617.335078 160.625766)">and gauge sign corrections</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(646.290547 310.228609)">4. Three complete</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(642.894297 324.785766)">verification sweeps</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(347.553828 310.228609)">5. Discard gauge register;</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(340.910625 324.785766)">protected ordinary recovery</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(68.538516 310.228609)">6. Protected logical readout</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(94.292734 324.785766)">extracts encoded M</text>
   </g>
  </g>
