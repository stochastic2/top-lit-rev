   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="50.76" y="441.216" transform="rotate(-0 50.76 441.216)">A clean code–SWAP–code sweep fixes the logical magic branch. Later faults remain ordinary correctable errors.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="50.76" y="498.672" transform="rotate(-0 50.76 498.672)">Reject on any unexpected sign. Do not correct a suspicious record blindly back into the accepted sector.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="50.76" y="532.872" transform="rotate(-0 50.76 532.872)">This is a heralded verification scheme; noise can reduce yield without causing an accepted logical failure.</text>
   </g>
