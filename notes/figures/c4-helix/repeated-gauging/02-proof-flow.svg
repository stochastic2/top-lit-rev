   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233444" x="46.368" y="466.848" transform="rotate(-0 46.368 466.848)">All phases, wrong reports, and residual errors share one total budget of two faulty locations.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="46.368" y="500.7168" transform="rotate(-0 46.368 500.7168)">There is no independent whole-block SWAP measurement, and no coherent-F correction circuit.</text>
