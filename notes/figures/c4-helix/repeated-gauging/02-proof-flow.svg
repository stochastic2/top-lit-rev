   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233444" x="39.456" y="45.829031" transform="rotate(-0 39.456 45.829031)">Where the two faults can go</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="39.456" y="78.526125" transform="rotate(-0 39.456 78.526125)">One clean cycle fixes the logical projection. A later clean Pauli pass removes remaining inner-block errors.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(113.581875 149.137875)">Before a clean cycle</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(122.374688 162.57525)">errors on at most</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(113.6025 176.012625)">two inner C4 groups</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(409.6575 149.137875)">One clean, genuine</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(392.206875 162.57525)">gauging/ungauging cycle</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(386.865 176.012625)">prepares the target branch</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(706.62 149.137875)">Later faulty cycles</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(688.455 162.57525)">can again affect at most</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(701.1225 176.012625)">two inner C4 groups</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(679.078125 335.761875)">Three terminal Pauli passes</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(667.613438 349.19925)">contain a clean code projection</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(683.655938 362.636625)">that removes those errors</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(405.816563 335.761875)">After that clean pass</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(371.115937 349.19925)">only Pauli-check circuits remain:</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(386.173125 362.636625)">at most two physical errors</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(90.45375 335.761875)">Protected ordinary recovery</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(103.997813 349.19925)">and decoded B readout</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(86.05875 362.636625)">hand out encoded magic in C</text>
   </g>
