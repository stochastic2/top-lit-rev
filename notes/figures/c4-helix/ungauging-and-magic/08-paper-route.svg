   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(68.037812 145.708609)">1. Keep / reprepare vertices</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(75.875391 160.265766)">in their recorded X states</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(360.562969 145.708609)">2. Undo cluster circuit</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(374.965547 160.265766)">40 inverse CNOTs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(625.111719 145.708609)">3. Measure gauge qubits</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #ad3f58" transform="translate(693.156562 160.265766)">in Z</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687784" transform="translate(622.132891 309.868609)">4. Solve the edge parities</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687784" transform="translate(654.626797 324.425766)">for the offset t0</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(360.801641 309.868609)">5. Apply X on vertices</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(366.643516 324.425766)">whose offset bit is 1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(93.798125 309.868609)">6. Undo enrichment</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(78.45 324.425766)">20 inverse Fredkin gates</text>
   </g>
