   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233444" x="45.54" y="455.328" transform="rotate(-0 45.54 455.328)">Required: sufficiently good raw outputs and a fault-tolerant logical Clifford/measurement layer.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(78.591172 152.728609)">1. Gauging + ungauging</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #7755a4" transform="translate(76.865625 167.285766)">produces raw encoded M</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(344.376953 152.728609)">2. Protected code recovery</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(348.232266 167.285766)">and logical parity readout</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(622.292344 152.728609)">3. Logical Hadamard twirl</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(610.434922 167.285766)">sets a known magic direction</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687784" transform="translate(601.198828 316.888609)">4. Independent accepted copies</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687784" transform="translate(626.011562 331.445766)">enter a distillation batch</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(345.154922 316.888609)">5. Protected Clifford circuit</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #2473a6" transform="translate(354.737344 331.445766)">and logical Pauli checks</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(96.394062 316.888609)">6. Retain a purified</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #26836d" transform="translate(66.239141 331.445766)">encoded H-type magic state</text>
   </g>
  </g>
