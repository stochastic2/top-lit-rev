   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233444" x="38.7" y="51.157031" transform="rotate(-0 38.7 51.157031)">A fault-tolerant architecture can use the gauging circuit as a raw source</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687784" x="38.7" y="81.406125" transform="rotate(-0 38.7 81.406125)">Logical errors in raw magic states are removed by distillation, not by ordinary C4-Helix syndrome correction.</text>
   </g>
